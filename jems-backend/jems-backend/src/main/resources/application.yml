spring:
  application:
    name: jems-project-management

  data:
    mongodb:
      uri: mongodb://localhost:27017/JEMS_db

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: jemsSecretKeyForJWTTokenGenerationAndValidation2024
  expiration: 86400000

logging:
  level:
    root: INFO
    com.jems: DEBUG
    org.springframework.data.mongodb: DEBUG


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

